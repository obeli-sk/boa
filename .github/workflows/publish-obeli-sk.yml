name: Publish obeli-sk fork to crates.io

on:
  workflow_dispatch:
    inputs:
      exclude:
        description: >
          Crates to skip, separated by spaces, commas, or newlines.
          Use this to resume after a partial publication.
        required: false
        type: string
        default: ''
      dry_run:
        description: Dry run — package but do not upload to crates.io
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      - name: Show committed version
        run: |
          committed="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "Committed workspace version: $committed"
          echo "=== Publishable crate names ==="
          grep -H '^name' core/engine/Cargo.toml core/runtime/Cargo.toml

      # --no-verify avoids building against dependencies before they are indexed.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
          EXCLUDE: ${{ inputs.exclude }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flags=(--workspace --no-verify)
          mapfile -t excluded < <(printf '%s' "$EXCLUDE" | tr ',[:space:]' '\n')
          for crate in "${excluded[@]}"; do
            if [ -n "$crate" ]; then
              flags+=(--exclude "$crate")
            fi
          done
          if [ "$DRY_RUN" = "true" ]; then
            flags+=(--dry-run)
            echo "DRY RUN — crates will not actually be uploaded."
          fi
          cargo publish "${flags[@]}"
