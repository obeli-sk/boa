name: Publish obeli-sk fork to crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          Expected version to publish, e.g. `1.0.0-obeli-sk.8`. The obeli-sk-*
          crate renames and version are committed to the tree (via
          scripts/rename_for_obeli_sk.py), so this workflow publishes the tree
          exactly as committed. This input is a guard: the job fails if it does
          not match the committed workspace version.
        required: true
        type: string
      dry_run:
        description: Dry run — package but do not upload to crates.io
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      # The crate renames (obeli-sk-*) and version live in git, committed via
      # scripts/rename_for_obeli_sk.py, so what is published matches the source
      # exactly. Confirm the committed version matches the dispatch input as a
      # guard against publishing an unexpected version.
      - name: Verify committed version
        run: |
          committed="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "Committed workspace version: $committed"
          echo "Requested version:          ${{ inputs.version }}"
          if [ "$committed" != "${{ inputs.version }}" ]; then
            echo "::error::Committed version ($committed) does not match requested version (${{ inputs.version }}). Run scripts/rename_for_obeli_sk.py <version> and commit before dispatching."
            exit 1
          fi
          echo "=== Publishable crate names ==="
          grep -H '^name' core/engine/Cargo.toml core/runtime/Cargo.toml

      # --no-verify skips a local test-build from the registry, avoiding the
      # chicken-and-egg problem when a freshly uploaded crate isn't yet indexed.
      # cargo publish --workspace resolves topological order automatically and
      # skips publish=false crates (behavior stabilized in Cargo 1.90; boa's
      # rust-version = "1.91.0" guarantees this). The tree is published exactly
      # as committed, so no --allow-dirty.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          FLAGS="--no-verify"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
            echo "DRY RUN — crates will not actually be uploaded."
          fi
          # shellcheck disable=SC2086
          cargo publish --workspace $FLAGS
